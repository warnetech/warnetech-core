name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev,service]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q
      - name: Quickstart runs offline
        run: python examples/quickstart.py
      - name: AI controller integration runs offline
        run: python examples/ai_controller_integration.py
